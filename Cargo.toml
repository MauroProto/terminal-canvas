[package]
name = "mi-terminal"
version = "1.2.0"
edition = "2021"
description = "A native desktop terminal and agent workspace manager, GPU-accelerated, cross-platform"
license = "MIT"

[features]
default = []
ghostty-vt = ["dep:libghostty-vt"]

[[bin]]
name = "mi-terminal"
path = "src/main.rs"

[[test]]
name = "perf_budget"
path = "tests/runtime/perf_budget.rs"

[[test]]
name = "runtime_registry"
path = "tests/runtime/registry.rs"

[[test]]
name = "runtime_pty_manager"
path = "tests/runtime/pty_manager.rs"

[[test]]
name = "runtime_scheduling"
path = "tests/runtime/scheduling.rs"

[[test]]
name = "runtime_render_qos"
path = "tests/runtime/render_qos.rs"

[[test]]
name = "runtime_repaint_policy_tests"
path = "tests/runtime/repaint_policy.rs"

[[test]]
name = "runtime_load_20_terminals"
path = "tests/runtime/load_20_terminals.rs"

[[test]]
name = "runtime_perf_scenarios"
path = "tests/runtime/perf_scenarios.rs"

[dependencies]
eframe = { version = "0.30", features = ["wgpu"] }
egui = "0.34"
alacritty_terminal = "0.25.1"
libghostty-vt = { version = "0.1.1", optional = true }
portable-pty = "0.9"
axum = { version = "0.7", features = ["ws", "json"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rmp-serde = "1.3"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
arboard = "3"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures-util = "0.3"
tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
chacha20poly1305 = { version = "0.10", features = ["std"] }
argon2 = "0.5"
base64 = "0.22"
rand = "0.8"
rcgen = "0.13"
url = "2"
sha2 = "0.10"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rustls = "0.23"
rustls-pemfile = "2"
mimalloc = { version = "0.1", default-features = false }
arc-swap = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"

[profile.dev]
opt-level = 1

# panic = "unwind" (default) on purpose: with "abort", a panic in ANY worker
# thread (PTY reader, collab server, transport) kills the whole app instantly.
# With unwind, worker threads can catch panics and degrade gracefully.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Un overflow aritmético silencioso corrompe estado (índices de grid,
# offsets de scrollback); panichear lo convierte en un bug visible que el
# contenedor de panics del update loop absorbe sin cerrar la app.
overflow-checks = true

[profile.dist]
inherits = "release"
lto = "thin"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
too_many_arguments = "allow"
# Todo bloque unsafe debe justificar por qué es sound.
undocumented_unsafe_blocks = "deny"
# Marcadores de trabajo a medias no llegan a master.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
