# Actualizaciones automatizadas de dependencias: un PR semanal por
# ecosistema, para que las correcciones de seguridad no dependan de que
# alguien se acuerde de correr `cargo update`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      egui-family:
        patterns:
          - egui
          - eframe
          - egui_kittest

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
