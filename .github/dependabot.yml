# Desarrollo local: sin PRs rutinarios de actualización de versiones.
# El límite 0 no desactiva las alertas ni las actualizaciones de seguridad;
# esas funciones dependen de la configuración de seguridad del repositorio.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      egui-family:
        patterns:
          - egui
          - eframe
          - egui_kittest

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
