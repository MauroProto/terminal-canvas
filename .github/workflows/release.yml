name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build and exercise unsigned packages, and never publish.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-prefix: ${{ steps.version.outputs.artifact-prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"
      - name: Verify version and publication trigger
        id: version
        shell: bash
        run: |
          version="$(python scripts/package-verify.py --version-only)"
          prefix="dry-run"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            test "$GITHUB_REF" = "refs/tags/v$version"
            prefix="release"
          else
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact-prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "Package version: $version; mode: $prefix" >> "$GITHUB_STEP_SUMMARY"
      - name: Test package validation regressions
        run: python scripts/package-verify-tests.py

      - name: Verify graphics dependencies and native features
        run: python scripts/graphics-deps-verify.py

  macos-dmg:
    needs: metadata
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TC_BUNDLE_TARGET: ${{ matrix.target }}
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"

      - name: Import signing certificate for publication
        if: github.event_name == 'push'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        shell: bash
        run: |
          for name in CERTIFICATE_P12 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD CODESIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required publication secret: $name" >&2
              exit 1
            fi
          done
          [[ "$CODESIGN_IDENTITY" == "Developer ID Application:"* ]]
          keychain="$RUNNER_TEMP/terminalcanvas.keychain-db"
          certificate="$RUNNER_TEMP/terminalcanvas.p12"
          umask 077
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Release preflight
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features daemon -- -D warnings
          cargo test --all-targets --locked --features daemon --quiet

      - name: Build unsigned DMG for dry-run
        if: github.event_name == 'workflow_dispatch'
        run: scripts/bundle.sh --dmg

      - name: Build signed app and DMG for publication
        if: github.event_name == 'push'
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          scripts/bundle.sh --dmg
          codesign --force --timestamp --sign "$CODESIGN_IDENTITY" "dist/TerminalCanvas-$PACKAGE_VERSION-macos-${{ matrix.arch }}.dmg"

      - name: Notarize and staple publication DMG
        if: github.event_name == 'push'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="dist/TerminalCanvas-$PACKAGE_VERSION-macos-${{ matrix.arch }}.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait --output-format json > "$RUNNER_TEMP/notary.json"
          python -c 'import json, os; result=json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "notary.json"))); print("Notarization status:", result.get("status")); assert result.get("status") == "Accepted", "Notarization was not accepted"'
          xcrun stapler staple "$dmg"
          (cd dist && shasum -a 256 "$(basename "$dmg")") > "$dmg.sha256"

      - name: Verify mounted dry-run DMG and bundled helpers
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/package-verify.py --dmg "dist/TerminalCanvas-$PACKAGE_VERSION-macos-${{ matrix.arch }}.dmg" --target '${{ matrix.target }}'

      - name: Verify mounted signed and notarized publication DMG
        if: github.event_name == 'push'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/package-verify.py --dmg "dist/TerminalCanvas-$PACKAGE_VERSION-macos-${{ matrix.arch }}.dmg" --target '${{ matrix.target }}' --require-signature --team-id "$APPLE_TEAM_ID"

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: ${{ needs.metadata.outputs.artifact-prefix }}-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/TerminalCanvas-*.dmg
            dist/TerminalCanvas-*.dmg.sha256

      - name: Remove temporary signing material
        if: always() && github.event_name == 'push'
        run: |
          security delete-keychain "$RUNNER_TEMP/terminalcanvas.keychain-db" || true
          rm -f "$RUNNER_TEMP/terminalcanvas.p12"

  portable:
    needs: metadata
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.runner }}
    env:
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"

      - name: Import Windows signing certificate for publication
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        env:
          CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:CERTIFICATE_PFX -or -not $env:CERTIFICATE_PASSWORD -or -not $env:TIMESTAMP_URL) {
            throw 'Windows publication requires WINDOWS_CERTIFICATE_PFX, WINDOWS_CERTIFICATE_PASSWORD and WINDOWS_TIMESTAMP_URL'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'terminalcanvas-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:CERTIFICATE_PFX))
            $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
            $certificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password | Where-Object HasPrivateKey)
            if ($certificates.Count -ne 1) { throw 'The PFX must contain exactly one signing certificate with a private key' }
            $env:TC_WINDOWS_CERT_THUMBPRINT = $certificates[0].Thumbprint
            $env:TC_WINDOWS_TIMESTAMP_URL = $env:TIMESTAMP_URL
            "TC_WINDOWS_CERT_THUMBPRINT=$env:TC_WINDOWS_CERT_THUMBPRINT" >> $env:GITHUB_ENV
            "TC_WINDOWS_TIMESTAMP_URL=$env:TC_WINDOWS_TIMESTAMP_URL" >> $env:GITHUB_ENV
            . ./scripts/package-sign-windows.ps1
            Assert-TerminalCanvasWindowsSigningConfiguration
            Get-TerminalCanvasSignTool | Out-Null
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux font dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked --quiet

      - name: Linux daemon preflight
        if: runner.os == 'Linux'
        run: |
          cargo clippy --all-targets --locked --features daemon -- -D warnings
          cargo test --all-targets --locked --features daemon --quiet

      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Target '${{ matrix.target }}'

      - name: Verify extracted Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package-verify.py --archive "dist/TerminalCanvas-$env:PACKAGE_VERSION-windows-x86_64.zip" --target '${{ matrix.target }}' --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Windows package verification failed' }

      - name: Build and exercise Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-installer.ps1 -VerifyInstall

      - name: Build Linux portable tarball
        if: runner.os == 'Linux'
        env:
          TC_PORTABLE_TARGET: ${{ matrix.target }}
        run: scripts/package-portable.sh

      - name: Verify extracted Linux package
        if: runner.os == 'Linux'
        run: python scripts/package-verify.py --archive "dist/TerminalCanvas-$PACKAGE_VERSION-linux-x86_64.tar.gz" --target '${{ matrix.target }}' --smoke

      - name: Upload verified portable and installer artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: ${{ needs.metadata.outputs.artifact-prefix }}-${{ matrix.platform }}-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/TerminalCanvas-*.zip
            dist/TerminalCanvas-*.zip.sha256
            dist/TerminalCanvas-*.tar.gz
            dist/TerminalCanvas-*.tar.gz.sha256
            dist/TerminalCanvas-*-setup.exe
            dist/TerminalCanvas-*-setup.exe.sha256

      - name: Remove Windows signing certificate
        if: always() && runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          if ($env:TC_WINDOWS_CERT_THUMBPRINT -match '^[0-9a-fA-F]{40}$') {
            Remove-Item -LiteralPath "Cert:/CurrentUser/My/$env:TC_WINDOWS_CERT_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }

  verify-set:
    needs: [metadata, macos-dmg, portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"
      - name: Download all verified packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, Node 24
        with:
          pattern: ${{ needs.metadata.outputs.artifact-prefix }}-*
          merge-multiple: true
          path: dist
      - name: Verify exact complete release asset set and checksums
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python scripts/package-verify.py --release-dir dist --version "$PACKAGE_VERSION"
      - name: Record completed validation
        env:
          MODE: ${{ needs.metadata.outputs.artifact-prefix }}
        run: |
          if [[ "$MODE" == "dry-run" ]]; then
            echo 'Dry-run passed: five packages, extracted helper smoke tests, Windows install/uninstall. These artifacts are unsigned test builds; nothing was published.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Five publication packages verified. macOS Developer ID/notarization and Windows Authenticode signatures passed.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    # A manual dispatch can never gain publication permissions or bypass signing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, verify-set]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"
      - name: Download verified publication packages
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, Node 24
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Recheck publication files and tag
        env:
          PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          test "$GITHUB_REF" = "refs/tags/v$PACKAGE_VERSION"
          python scripts/package-verify.py --release-dir dist --version "$PACKAGE_VERSION"
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3, Node 24
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/TerminalCanvas-*
