name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      TC_BUNDLE_TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Release preflight
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --locked --features daemon -- -D warnings
          cargo test --all-targets --locked --features daemon --quiet

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE_P12" || -z "$CERTIFICATE_PASSWORD" || -z "$KEYCHAIN_PASSWORD" ]]; then
            echo "Faltan secrets del certificado de firma" >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/terminalcanvas.keychain-db"
          certificate="$RUNNER_TEMP/terminalcanvas.p12"
          echo "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"

      - name: Build signed DMG
        env:
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: |
          if [[ -z "$CODESIGN_IDENTITY" ]]; then
            echo "Falta el secret CODESIGN_IDENTITY" >&2
            exit 1
          fi
          scripts/bundle.sh --dmg

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            echo "Faltan credenciales de notarización Apple" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          dmg="dist/TerminalCanvas-${version}-macos-${{ matrix.arch }}.dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          (cd dist && shasum -a 256 "$(basename "$dmg")") | tee "$dmg.sha256"

      - name: Verify bundle and checksum
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -x dist/TerminalCanvas.app/Contents/MacOS/mi-terminal-daemon
          test -x dist/TerminalCanvas.app/Contents/MacOS/tc-memory
          test -x dist/TerminalCanvas.app/Contents/MacOS/tc-memory-mcp
          (cd dist && shasum -a 256 -c "TerminalCanvas-${version}-macos-${{ matrix.arch }}.dmg.sha256")
          codesign --verify --deep --strict --verbose=2 dist/TerminalCanvas.app

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/TerminalCanvas-*.dmg
            dist/TerminalCanvas-*.dmg.sha256

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/terminalcanvas.keychain-db" || true
          rm -f "$RUNNER_TEMP/terminalcanvas.p12"

  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(awk -F'"' '/^version[[:space:]]*=/ {print $2; exit}' Cargo.toml)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --all-targets --locked --quiet

      - name: Linux daemon preflight
        if: runner.os == 'Linux'
        run: |
          cargo clippy --all-targets --locked --features daemon -- -D warnings
          cargo test --all-targets --locked --features daemon --quiet

      - name: Build Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-portable.ps1 -Target '${{ matrix.target }}'

      - name: Verify Windows checksum and helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Se esperaba exactamente un ZIP' }
          $archive = $archives[0]
          $expected = (Get-Content -LiteralPath ($archive.FullName + '.sha256')).Split(' ')[0]
          if ((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Checksum del paquete no coincide'
          }
          & './target/${{ matrix.target }}/release/tc-memory.exe' --help
          if ($LASTEXITCODE -ne 0) { throw 'Helper de memoria no ejecutable' }

      - name: Build Linux portable tarball
        if: runner.os == 'Linux'
        env:
          TC_PORTABLE_TARGET: ${{ matrix.target }}
        run: scripts/package-portable.sh

      - name: Verify Linux checksum and helper
        if: runner.os == 'Linux'
        run: |
          (cd dist && sha256sum -c *.sha256)
          target/${{ matrix.target }}/release/tc-memory --help

      - name: Upload verified portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-x86_64
          if-no-files-found: error
          path: |
            dist/TerminalCanvas-*.zip
            dist/TerminalCanvas-*.zip.sha256
            dist/TerminalCanvas-*.tar.gz
            dist/TerminalCanvas-*.tar.gz.sha256

  publish:
    needs: [macos-dmg, portable]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all verified packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify complete release checksums
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 4
          sha256sum -c *.sha256

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/TerminalCanvas-*
