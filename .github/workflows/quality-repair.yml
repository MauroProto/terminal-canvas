name: Apply reviewed quality repairs

on:
  push:
    branches: ["codex/premium-quality"]
    paths:
      - ".github/workflows/quality-repair.yml"

permissions:
  contents: write

concurrency:
  group: quality-repair-premium
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Create reviewed microcommits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/quality-repair.py
      - name: Publish feature branch only, without force
        run: |
          test "$(git ls-remote origin refs/heads/codex/premium-quality | cut -f1)" = "${{ github.sha }}"
          git diff --exit-code "${{ github.sha }}" HEAD -- src/collab
          git push origin HEAD:refs/heads/codex/premium-quality
      - name: Clippy base
        id: clippy_base
        continue-on-error: true
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy daemon
        id: clippy_daemon
        continue-on-error: true
        run: cargo clippy --all-targets --locked --features daemon -- -D warnings
      - name: Final PTY burst
        id: burst
        continue-on-error: true
        run: cargo test --locked --features daemon --lib daemon::server::tests::priority_session_delivers_its_entire_final_burst_before_exit -- --nocapture
      - name: Early process exit signal
        id: early_exit
        continue-on-error: true
        run: cargo test --locked --features daemon --lib daemon::server::tests::early_exit_signal_does_not_discard_later_pty_output -- --nocapture
      - name: TUI history restoration
        id: tui
        continue-on-error: true
        run: cargo test --locked --features daemon --test daemon_process attaching_inside_a_tui_recovers_primary_history_when_it_exits -- --nocapture
      - name: Eight parallel PTYs
        id: parallel
        continue-on-error: true
        run: cargo test --locked --features daemon --test daemon_process several_real_ptys_finish_parallel_output_bursts -- --nocapture
      - name: Partial response regressions
        id: responses
        continue-on-error: true
        run: cargo test --locked --features daemon --test daemon_process daemon_response::tests -- --nocapture
      - name: Browser extension
        id: extension
        continue-on-error: true
        run: node --test extension/tests/*.test.cjs
      - name: Preserve every validation failure
        if: contains(steps.*.outcome, 'failure')
        run: exit 1
