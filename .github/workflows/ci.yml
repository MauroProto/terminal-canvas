name: CI

on:
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
  # Also verify an exact selected branch after a token-driven delivery.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

# Un push nuevo cancela la corrida anterior de la misma rama (en master no,
# para no perder señal de commits intermedios).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # macOS es la plataforma primaria: sin este runner, los caminos
      # #[cfg(target_os = "macos")] (clipboard, dirección de scroll,
      # atajos) no se compilan ni testean nunca en CI. Windows cubre los
      # caminos #[cfg(windows)] (shell por COMSPEC, PTY de ConPTY).
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Retain dependency compilation even when a new GUI/test regression
          # fails. Workspace code is rebuilt and all checks still determine exit.
          cache-on-failure: true

      - name: Install Linux font dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev xvfb xauth openbox xdotool imagemagick tesseract-ocr libvulkan1 mesa-vulkan-drivers libxkbcommon-x11-0

      - name: Format check
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Verify graphics dependencies and native features
        if: runner.os == 'Linux'
        run: python3 scripts/graphics-deps-verify.py

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run test suite
        run: cargo test --all-targets --locked --quiet --no-fail-fast

      - name: Security regressions
        run: cargo test --lib --locked security_ -- --nocapture

      # Preserve independent GUI evidence even when a unit regression fails.
      - name: Build native GUI smoke binary
        if: "!cancelled() && runner.os == 'Linux'"
        run: cargo build --locked --bin mi-terminal

      - name: Native GUI persistence and recovery
        if: "!cancelled() && runner.os == 'Linux'"
        timeout-minutes: 6
        env:
          WGPU_BACKEND: vulkan
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          install -d -m 700 "$RUNNER_TEMP/native-gui-runtime"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/native-gui-runtime"
          xvfb-run -a --server-args="-screen 0 1280x800x24 -nolisten tcp" bash <<'DESKTOP'
          set -euo pipefail
          openbox > "$RUNNER_TEMP/native-gui-openbox.log" 2>&1 &
          wm_pid=$!
          trap 'kill "$wm_pid" 2>/dev/null || true' EXIT
          python3 scripts/gui-smoke.py --binary target/debug/mi-terminal --output "$RUNNER_TEMP/native-gui-smoke"
          DESKTOP

      - name: Upload native GUI evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0, Node 24
        with:
          name: native-gui-evidence-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/native-gui-smoke/result.json
            ${{ runner.temp }}/native-gui-smoke/app-*.stdout
            ${{ runner.temp }}/native-gui-smoke/app-*.stderr
            ${{ runner.temp }}/native-gui-smoke/screen-*.png
            ${{ runner.temp }}/native-gui-smoke/screen-*.txt
            ${{ runner.temp }}/native-gui-smoke/export-*.txt
            ${{ runner.temp }}/native-gui-smoke/layout-*.json

      # El daemon usa Unix sockets. Ubuntu y macOS validan el artefacto que se
      # distribuye; Windows conserva la cobertura del fallback in-process.
      - name: Check daemon feature (Unix)
        if: runner.os != 'Windows'
        run: cargo check --all-targets --locked --features daemon

      - name: Clippy daemon feature (Unix)
        if: runner.os != 'Windows'
        run: cargo clippy --all-targets --locked --features daemon -- -D warnings

      - name: Run daemon feature test suite (Unix)
        if: runner.os != 'Windows'
        run: cargo test --all-targets --locked --features daemon --quiet --no-fail-fast

  extension:
    # Una regresión de Rust no debe ocultar la señal de la extensión.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false
      - name: Verify browser extension
        run: node --test extension/tests/*.test.cjs

  bench:
    # Presupuesto de performance (Ship-it 7.3): compara las rutas calientes
    # contra el commit anterior y falla si algo se degrada más de 15%.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false
          # El script necesita el commit base para armar el worktree.
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Linux font dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Compare hot-path benchmarks
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/bench-compare.sh "origin/$BASE_REF" 15

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.1.0, Node 24
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit
