name: Verify final burst fixture

on:
  push:
    branches: ["codex/premium-quality"]
    paths: [".github/workflows/quality-fixture.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Separate fixture lines from shell control output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/daemon/server.rs')
          s = p.read_text()
          old = "sh -c 'i=0; while"
          new = r'''sh -c 'printf \"\\n\"; i=0; while'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          anchor = '        let marker = format!("TC_FINAL_{}", Uuid::new_v4().simple());'
          assert s.count(anchor) == 1
          s = s.replace(anchor, '// Shell startup may prepend bracketed-paste control bytes to the first\n// output line. Delimit the burst so all 3000 markers remain whole lines.\n' + anchor)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = src/daemon/server.rs
          git diff -- src/daemon/server.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/daemon/server.rs
          git commit -m 'test(daemon): separate final burst lines from shell control output'
          test "$(git ls-remote origin refs/heads/codex/premium-quality | cut -f1)" = "${{ github.sha }}"
          git push origin HEAD:refs/heads/codex/premium-quality
      - name: Repeat the complete 3000-line assertion
        run: |
          for attempt in $(seq 1 10); do
            echo "Final-burst regression attempt ${attempt}/10"
            cargo test --locked --features daemon --lib daemon::server::tests::priority_session_delivers_its_entire_final_burst_before_exit -- --nocapture
          done
