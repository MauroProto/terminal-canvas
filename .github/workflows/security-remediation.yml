name: Apply security remediation

on:
  push:
    branches: [codex/security-remediation]
    paths: [.github/workflows/security-remediation.yml]

permissions:
  contents: read

jobs:
  apply:
    if: github.repository == 'MauroProto/terminal-canvas' && github.ref == 'refs/heads/codex/security-remediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install formatter
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98.0'
          components: rustfmt
      - name: Verify and apply source changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 9d7bf141426d384cf5083e41c7b97a5ddc46dcbd HEAD -- src extension Cargo.toml Cargo.lock
          python3 - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          encoded = ''.join(pathlib.Path(f'.github/security-patch.{n}.b64').read_text().strip() for n in (1, 2, 3))
          assert len(encoded) == 23904, 'Unexpected encoded patch length'
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert len(patch) == 71324, 'Unexpected decoded patch length'
          assert hashlib.sha256(patch).hexdigest() == 'eced5145a0808bce7db61a1420bd245e747fe6b5386a6198d49d52a86c09b907', 'Patch integrity failure'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'security-fixes.mbox').write_bytes(patch)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c core.hooksPath=/dev/null am "$RUNNER_TEMP/security-fixes.mbox"
          cargo fmt --all
          if ! git diff --quiet; then
            git add src extension
            git -c core.hooksPath=/dev/null commit -m 'style: format security remediation with pinned Rust toolchain'
          fi
          git rm .github/security-patch.1.b64 .github/security-patch.2.b64 .github/security-patch.3.b64 .github/workflows/security-remediation.yml
          git -c core.hooksPath=/dev/null commit -m 'ci: remove temporary security remediation transfer files'
          git diff --check 9d7bf141426d384cf5083e41c7b97a5ddc46dcbd HEAD
          git log -8 --oneline
          git rev-parse HEAD
      - name: Push only the remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin HEAD:refs/heads/codex/security-remediation
