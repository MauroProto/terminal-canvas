name: Quality diagnostics

on:
  push:
    branches: ["codex/premium-quality"]
    paths: [".github/workflows/quality-diagnostics.yml"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Propose rustls security update
        run: |
          cargo update -p rustls --precise 0.23.45
          git diff -- Cargo.lock
      - name: Add failure diagnostics without changing the assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/daemon/server.rs')
          s = p.read_text()
          old = '"Exit arrived before the complete final output"'
          new = '"Exit arrived before the complete final output: lines={}, bytes={}, head={:?}, tail={:?}", text.lines().filter(|line| line.trim() == marker).count(), output.len(), &output[..output.len().min(256)], &output[output.len().saturating_sub(256)..]'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Final PTY burst regression
        id: burst
        continue-on-error: true
        run: cargo test --locked --features daemon --lib daemon::server::tests::priority_session_delivers_its_entire_final_burst_before_exit -- --nocapture
      - name: Browser extension tests
        if: always()
        run: node --test extension/tests/*.test.cjs
      - name: Upload proposed lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustls-lockfile-proposal
          path: Cargo.lock
          retention-days: 3
      - name: Preserve regression failure
        if: steps.burst.outcome == 'failure'
        run: exit 1
