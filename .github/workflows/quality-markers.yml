name: Verify PTY completion markers

on:
  push:
    branches: ["codex/premium-quality"]
    paths: [".github/workflows/quality-markers.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Require two generated markers instead of command echo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/daemon_process.rs')
          s = p.read_text()
          old = '                let marker = format!("load_done_{index}_{}", Uuid::new_v4().simple());'
          assert s.count(old) == 1
          s = s.replace(old, old + '\n                // Neither marker is present in the command echo. Both must be\n                // emitted by Python after the entire payload has been written.\n                let (prefix, suffix) = marker.split_at(marker.len() / 2);')
          old = r'''"python3 -c \"import sys;sys.stdout.write('x'*{OUTPUT_BYTES});print('{marker}')\"\n"'''
          new = r'''"python3 -c \"import sys;m='{prefix}'+'{suffix}';sys.stdout.write('x'*{OUTPUT_BYTES});print(m);print(m)\"\n"'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          start = s.index('fn several_real_ptys_finish_parallel_output_bursts() {')
          end = s.index('\n#[test]', start)
          part = s[start:end]
          anchor = '                send(\n                    &Request::Write {'
          assert part.count(anchor) == 1
          part = part.replace(anchor, '                assert!(!command.contains(&marker), "marker must not come from echo");\n' + anchor)
          anchor = '                    match next(&mut reader, deadline) {'
          replacement = '''                    match daemon_response::read_before(&mut reader, deadline).unwrap_or_else(|error| {
                                  panic!(
                                      "session {index}: {error}; bytes={}, markers={}, payload={}, head={:?}, tail={:?}",
                                      output.len(),
                                      output.windows(marker.len()).filter(|window| *window == marker.as_bytes()).count(),
                                      daemon_response::longest_printed_run(&output, 'x'),
                                      String::from_utf8_lossy(&output[..output.len().min(128)]),
                                      String::from_utf8_lossy(&output[output.len().saturating_sub(128)..]),
                                  )
                              }) {'''
          assert part.count(anchor) == 1
          part = part.replace(anchor, replacement)
          anchor = '''    for worker in workers {
                  worker.join().expect("worker de carga");
              }'''
          assert part.count(anchor) == 1
          part = part.replace(anchor, '''    // Join every worker before dropping the daemon, even if one failed.
              let results: Vec<_> = workers.into_iter().map(std::thread::JoinHandle::join).collect();
              assert!(results.iter().all(Result::is_ok), "worker de carga");''')
          p.write_text(s[:start] + part + s[end:])
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          test "$(git diff --name-only)" = tests/daemon_process.rs
          git diff -- tests/daemon_process.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/daemon_process.rs
          git commit -m 'test(daemon): require completion markers emitted by the process'
          test "$(git ls-remote origin refs/heads/codex/premium-quality | cut -f1)" = "${{ github.sha }}"
          git push origin HEAD:refs/heads/codex/premium-quality
      - name: Clippy daemon
        run: cargo clippy --all-targets --locked --features daemon -- -D warnings
      - name: Repeat all eight complete 512 KiB bursts on macOS Intel
        run: |
          for attempt in $(seq 1 5); do
            echo "Parallel PTY regression attempt ${attempt}/5"
            cargo test --locked --features daemon --test daemon_process several_real_ptys_finish_parallel_output_bursts -- --nocapture
          done
      - name: Diagnose the previous echo-dependent condition
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/daemon_process.rs')
          s = p.read_text()
          new = r'''"python3 -c \"import sys;m='{prefix}'+'{suffix}';sys.stdout.write('x'*{OUTPUT_BYTES});print(m);print(m)\"\n"'''
          old = r'''"python3 -c \"import sys;sys.stdout.write('x'*{OUTPUT_BYTES});print('{marker}')\"\n"'''
          assert s.count(new) == 1
          s = s.replace(new, old)
          s = s.replace('let (prefix, suffix) = marker.split_at(marker.len() / 2);', 'let (_prefix, _suffix) = marker.split_at(marker.len() / 2);')
          s = s.replace('assert!(!command.contains(&marker), "marker must not come from echo");', '')
          p.write_text(s)
          PY
          cargo test --locked --features daemon --test daemon_process several_real_ptys_finish_parallel_output_bursts -- --nocapture
